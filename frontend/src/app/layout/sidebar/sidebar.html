<div class="brand">
  <!-- Logotipo del toro (docs/logo/) sobre una placa clara: el original tiene fondo blanco. -->
  <span class="plaque"><img src="brand/logo-88.jpg" width="36" height="44" alt="" /></span>
  <span class="wordmark">EVOLUTION<b>FIT</b></span>
</div>

<nav aria-label="Navegación principal">
  @for (group of groups(); track group.name) {
    <div class="group" role="group" [attr.aria-label]="group.name">
      <p class="group-title" aria-hidden="true">{{ group.name }}</p>
      @for (item of group.items; track item.path) {
        <a
          class="nav-item"
          matRipple
          [routerLink]="item.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.path === '/cash' }"
          (click)="navigated.emit()"
        >
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span class="label">{{ item.label }}</span>
          @if (item.alerts && alertTotal() > 0) {
            <span class="badge" [attr.aria-label]="alertTotal() + ' alertas de vencimiento'">{{ alertTotal() }}</span>
          }
        </a>
      }
    </div>
  }
</nav>

<button type="button" class="logout" matRipple (click)="logout()">
  <mat-icon aria-hidden="true">logout</mat-icon>
  <span>Cerrar sesión</span>
</button>
