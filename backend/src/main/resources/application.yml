spring:
  application:
    name: evolutionfit-backend

  config:
    # Carga el archivo .env (formato CLAVE=valor) si existe, tanto si arrancas desde backend/ como desde la raíz.
    # Así no tienes que exportar variables a mano en cada terminal.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/evolution_fit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&useUnicode=true&characterEncoding=UTF-8}
    # Si no defines DB_USERNAME / DB_PASSWORD se usan MYSQL_USER / MYSQL_PASSWORD del .env.
    username: ${DB_USERNAME:${MYSQL_USER:evolution_app}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # El esquema lo gestiona Flyway. Hibernate nunca modifica ni valida tablas.
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Si la BD ya existe (sin historial de Flyway) se toma como versión 1 y no se vuelve a ejecutar V1.
    # Si la BD está vacía, se ejecuta V1 completo.
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      # Margen sobre los 500 KB del logo: así el backend responde con el mensaje claro de 500 KB.
      max-file-size: 2MB
      max-request-size: 2MB

  jackson:
    time-zone: America/Bogota
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # Obligatorio y de al menos 32 caracteres. Sin valor por defecto a propósito:
    # si falta, la aplicación no arranca (así nunca queda funcionando con una clave conocida).
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  memberships:
    # Reglas del dueño (docs/REGLAS_NEGOCIO.md). Cambiarlas no requiere migración.
    expiry-warning-days: ${MEMBERSHIP_EXPIRY_WARNING_DAYS:5}
    max-freeze-days: ${MEMBERSHIP_MAX_FREEZE_DAYS:30}
    # Alerta "vencidas recientes" del panel y de Vencimientos: días hacia atrás desde ayer.
    recently-expired-days: ${MEMBERSHIP_RECENTLY_EXPIRED_DAYS:15}
  receipts:
    # Tamaño del comprobante PDF: A5 (vertical, para enviarlo por WhatsApp y leerlo en el celular) o LETTER.
    paper-size: ${RECEIPT_PAPER_SIZE:A5}
  cash:
    # Hora del cierre automático diario (hora de Bogotá). La base, la fecha de inicio y los días que abre
    # los edita el ADMIN en "Configuración de caja" (tabla cash_settings).
    closing-time: ${CASH_CLOSING_TIME:22:00}
  reports:
    # Días máximos de un rango de fechas en los reportes del ADMIN (366: un año completo).
    max-range-days: ${REPORTS_MAX_RANGE_DAYS:366}
  e2e:
    # Solo pruebas de punta a punta (carpeta e2e/). Además del perfil e2e, E2eGuard exige este valor en true y
    # la base de pruebas jdbc:mysql://localhost:3308/evolution_fit_e2e; si no, el backend no arranca.
    enabled: ${APP_E2E_ENABLED:false}
  bootstrap-admin:
    # Solo se usa si la tabla users está vacía. Con la contraseña vacía no se crea ningún administrador.
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Administrador}
    last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Sistema}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
