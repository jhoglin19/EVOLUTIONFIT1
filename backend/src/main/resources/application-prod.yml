# Perfil de producción (SPRING_PROFILES_ACTIVE=prod). Solo lo que cambia frente a application.yml.
# ProdGuard impide arrancar este perfil junto con e2e o con APP_E2E_ENABLED=true.

springdoc:
  # Swagger apagado por defecto: /v3/api-docs y /swagger-ui.html responden 404. Para una revisión puntual se
  # enciende con SWAGGER_ENABLED=true y se vuelve a apagar.
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

server:
  tomcat:
    remoteip:
      # Solo Caddy puede decir cuál es la IP del cliente (X-Forwarded-For): la red "app" de docker-compose.prod.yml
      # (subred fija 172.28.10.0/24). Una conexión desde cualquier otra dirección se toma tal cual, con su propia IP.
      # Si se cambia APP_SUBNET en el compose, este patrón debe cambiar igual (TRUSTED_PROXIES_REGEX).
      internal-proxies: ${TRUSTED_PROXIES_REGEX:172\.28\.10\.\d+}
